name: 'Baidu Tieba Auto Sign'
on:
  push:
    branches:
      - main
  workflow_dispatch:   # 增加手动一键运行按钮，方便调试排查
  schedule:
    - cron: '5 16,22 * * *'  # 每天 UTC 16:05 和 22:05 (对应北京时间 00:05 和 06:05)
jobs:
  tieba_sign:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v4
      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 'Install dependencies'
        run: python -m pip install --upgrade requests pypushdeer
      - name: 'Start Sign'
        env:
          BDUSS: ${{ secrets.BDUSS }}
        run: python main.py
